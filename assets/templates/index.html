<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/srt.js"></script>
    <style>
      @font-face { font-family: "Noto Sans SC"; src: local("Microsoft YaHei"); }

      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--mv-ground, #1b1a17);
      }

      /* 场次宿主：必须 position:absolute; inset:0，否则会塌缩成 0 高 */
      .scene-host { position: absolute; inset: 0; }

      /* 字幕：根 composition 里，画面下方，永远在最上层，不参与任何 transform */
      #subs-wrap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 96px;
        text-align: center;
        z-index: 99;
        pointer-events: none;
      }
      /* 衬底：WCAG 对比度靠它兜底，不能只靠 text-shadow
         （check 的 contrast 段量的是文字与背后像素，浅底画面下 1.75:1 会被判 error） */
      #subs {
        display: inline-block;
        max-width: 82%;
        padding: 0.06em 0.42em 0.14em;
        border-radius: 6px;
        background: rgba(12, 10, 9, 0.42);
        font-family: "Noto Sans SC", sans-serif;
        font-size: 56px;
        line-height: 1.4;
        letter-spacing: 0.04em;
        color: #fffdf7;
        text-shadow:
          0 2px 0 rgba(0, 0, 0, 0.55),
          0 0 18px rgba(0, 0, 0, 0.45);
      }
      /* 字幕为空时不显示衬底 */
      #subs:empty { display: none; }
    </style>
  </head>
  <body>
    <!--
      用法：
      1. 把 data-duration 改成 ffprobe 量到的音频时长（三处：根、字幕层、音轨）
      2. 按 storyboard.md 复制 .scene-host，data-start/data-duration 严格衔接
         （每加一个场景就要有对应的 compositions/sNN.html，否则 check 报 missing_or_empty_sub_composition）
      3. data-composition-id 必须与 compositions/<file>.html 里的 id 一致
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-composition-variables='[
        {"id":"mv-ground","type":"color","label":"底色","default":"#1b1a17"},
        {"id":"mv-ink","type":"color","label":"主色","default":"#f4efe4"},
        {"id":"mv-accent","type":"color","label":"点缀","default":"#e0693a"}
      ]'
    >
      <!-- 场次（按分镜顺序，时间无缝衔接） -->
      <div
        id="s01"
        class="scene-host clip"
        data-composition-id="s01"
        data-composition-src="compositions/s01.html"
        data-start="0"
        data-duration="6"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 字幕（不随镜头动）
           ⚠ 绝对不要加 class="clip" / data-start / data-duration / data-track-index。
           渲染器会把带 .clip 的元素当时间轴片段管理，而字幕层没有任何 tween 作用在它上面，
           结果整层被判为「不可见」—— 画面上一句字幕都不出，且不报错。
           实测：加 .clip → 字幕完全不渲染；去掉 → 正常。 -->
      <div id="subs-wrap">
        <span id="subs"></span>
      </div>

      <!-- 音轨：data-timeline-role="music" 才能跑 hyperframes beats -->
      <audio
        id="music"
        data-timeline-role="music"
        data-start="0"
        data-duration="6"
        src="assets/audio/song.mp3"
        data-volume="1"
      ></audio>
    </div>

    <script>
      // 根时间轴：只做字幕的进出，场次动画在各场景文件里
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // ---- 字幕驱动：逐帧从歌词取当前句 ----
      //
      // 三条触发路径都要挂上，缺一条就会「字幕不显示」：
      //   1. 时间轴自己的 onUpdate —— 渲染器逐帧 seek 时间轴时一定触发，最可靠
      //   2. hf-seek 事件 —— 部分版本会派发，canvas 类也用它
      //   3. 歌词就绪后立即补画一次 —— 否则加载期间那几帧是空白
      //
      // 两个踩过的坑：
      //   a) 把 addEventListener 写在 await 之后 → 渲染器先 seek、监听器后注册，
      //      事件全部错过，画面上一句字幕都不出。监听必须同步注册。
      //   b) 用 fetch 异步读 lyrics.srt → 渲染器可能在 fetch 完成前就抓帧。
      //      歌词才几 KB，直接内联成 assets/lib/lyrics.js（见 lrc2srt.py --js-out）最稳。
      (function () {
        const subsEl = document.getElementById("subs");
        let cues = [];
        let last = null;

        function paint(t) {
          if (!cues.length) return;
          const cue = MVSrt.at(cues, t);
          const text = cue ? cue.text : "";
          if (text !== last) {
            subsEl.textContent = text;
            last = text;
          }
        }

        tl.eventCallback("onUpdate", function () { paint(tl.time()); });
        window.addEventListener("hf-seek", function (e) { paint(e.detail.time); });

        // 优先用内联的 window.MV_LYRICS（同步，无竞态）
        if (window.MV_LYRICS && window.MV_LYRICS.length) {
          cues = window.MV_LYRICS;
          paint(tl.time());
        } else {
          // 退路：没有内联文件就读 SRT（可能因 fetch 竞态丢首帧字幕）
          MVSrt.load("assets/lyrics.srt", { gap: 0.12 })
            .then(function (c) { cues = c; paint(tl.time()); })
            .catch(function (e) { console.warn("没有歌词，字幕关闭", e); });
        }
      })();
    </script>
  </body>
</html>
